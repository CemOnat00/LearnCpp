<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C++ Hocam — İnteraktif C++ Dersleri (Hafta 1-7)</title>
<style>
:root{
  --bg:#f6f3ec; --panel:#fffdf8; --panel2:#f0ebe0; --ink:#1d2433; --ink2:#4a5468; --muted:#8a8f9c;
  --line:#e2dccd; --accent:#0f766e; --accent2:#14b8a6; --accent-soft:#d6f0ec;
  --coral:#e4572e; --coral-soft:#fde3da; --gold:#d99a00; --gold-soft:#fff1c7;
  --ok:#15803d; --ok-soft:#dcfce7; --bad:#c2410c; --bad-soft:#ffe4d6; --info:#2563eb; --info-soft:#dbeafe;
  --code-bg:#1b1f2b; --code-ink:#e6e8ef; --shadow:0 1px 2px rgba(30,30,20,.06),0 4px 14px rgba(30,30,20,.06);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --side:290px;
}
[data-theme="dark"]{
  --bg:#12151d; --panel:#1a1e29; --panel2:#222736; --ink:#e8eaf0; --ink2:#b4bac8; --muted:#7d8496;
  --line:#2d3343; --accent:#2dd4bf; --accent2:#5eead4; --accent-soft:#123b38;
  --coral:#ff7a52; --coral-soft:#3d2219; --gold:#fbbf24; --gold-soft:#3a2f10;
  --ok:#4ade80; --ok-soft:#14321f; --bad:#fb923c; --bad-soft:#3b2214; --info:#60a5fa; --info-soft:#172a48;
  --code-bg:#0d1017; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16.5px;line-height:1.65;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
button{font-family:inherit;font-size:inherit;cursor:pointer}
code{font-family:var(--mono);font-size:.88em;background:var(--panel2);padding:.1em .38em;border-radius:5px;border:1px solid var(--line)}
/* ---------- top bar ---------- */
.top{position:fixed;top:0;left:0;right:0;height:58px;display:flex;align-items:center;gap:14px;padding:0 18px;background:var(--panel);border-bottom:1px solid var(--line);z-index:30}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:1.25rem;font-weight:700;color:var(--ink);text-decoration:none;white-space:nowrap}
.brand .logo{width:34px;height:34px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:var(--mono);font-size:.95rem;font-weight:800}
[data-theme="dark"] .brand .logo{color:#0b1a18}
.top .spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-size:.86rem;font-weight:600;color:var(--ink2);white-space:nowrap}
.pill.xp{background:var(--gold-soft);color:var(--gold);border-color:transparent}
.pill.fire{background:var(--coral-soft);color:var(--coral);border-color:transparent}
.iconbtn{border:1px solid var(--line);background:var(--panel2);color:var(--ink);width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:1.05rem}
.iconbtn:hover{border-color:var(--accent)}
#menuBtn{display:none}
/* ---------- side ---------- */
.side{position:fixed;top:58px;bottom:0;left:0;width:var(--side);overflow-y:auto;background:var(--panel);border-right:1px solid var(--line);padding:14px 10px 40px;z-index:20}
.side .nav-a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;color:var(--ink);text-decoration:none;font-size:.95rem}
.side .nav-a:hover{background:var(--panel2)}
.side .nav-a.on{background:var(--accent-soft);color:var(--accent);font-weight:650}
.side .nav-a .badge{margin-left:auto;background:var(--coral);color:#fff;border-radius:999px;font-size:.72rem;padding:1px 7px;font-weight:700}
.side h6{margin:18px 10px 6px;font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.unit-nav{margin:2px 0}
.unit-nav > .u-head{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;color:var(--ink);padding:8px 10px;border-radius:9px;font-size:.93rem;font-weight:600}
.unit-nav > .u-head:hover{background:var(--panel2)}
.u-head .wk{font-family:var(--mono);font-size:.7rem;color:var(--muted);background:var(--panel2);border-radius:5px;padding:1px 5px;font-weight:600}
.u-head .ring{margin-left:auto;font-size:.75rem;color:var(--muted);font-weight:600}
.u-head .chev{transition:transform .2s;color:var(--muted);font-size:.7rem}
.unit-nav.open .chev{transform:rotate(90deg)}
.u-lessons{display:none;padding:2px 0 6px 18px}
.unit-nav.open .u-lessons{display:block}
.u-lessons a{display:flex;gap:8px;align-items:flex-start;padding:5px 10px;border-radius:7px;font-size:.87rem;color:var(--ink2);text-decoration:none;line-height:1.35}
.u-lessons a:hover{background:var(--panel2)}
.u-lessons a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.u-lessons .ck{flex:none;width:16px;height:16px;border-radius:50%;border:1.6px solid var(--line);display:grid;place-items:center;font-size:.6rem;margin-top:1px}
.u-lessons .ck.done{background:var(--ok);border-color:var(--ok);color:#fff}
/* ---------- main ---------- */
main{margin-left:var(--side);padding:86px 28px 120px;min-height:100vh}
.wrap{max-width:860px;margin:0 auto}
.crumb{font-size:.85rem;color:var(--muted);margin-bottom:6px}
.crumb a{color:var(--muted);text-decoration:none}
h1,h2,h3,h4{font-family:var(--serif);line-height:1.25;color:var(--ink)}
h1{font-size:2.1rem;margin:.2em 0 .4em}
h2.lesson-title{font-size:1.95rem;margin:.1em 0 .6em}
.lesson h3{font-size:1.38rem;margin:1.8em 0 .5em;padding-top:.3em;border-top:1px dashed var(--line)}
.lesson h3:first-child{border-top:0;margin-top:.4em}
.lesson h4{font-size:1.12rem;margin:1.4em 0 .4em}
.lesson p{margin:.7em 0}
.lesson ul,.lesson ol{padding-left:1.4em}
.lesson li{margin:.25em 0}
hr{border:0;border-top:1px solid var(--line);margin:2em 0}
table{border-collapse:collapse;width:100%;margin:1em 0;font-size:.93rem;background:var(--panel);border-radius:10px;overflow:hidden;box-shadow:var(--shadow)}
th,td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--panel2);font-weight:650}
tr:last-child td{border-bottom:0}
.tablewrap{overflow-x:auto}
/* callouts */
.call{border-radius:12px;padding:12px 16px;margin:1.1em 0;border-left:4px solid;background:var(--info-soft);border-color:var(--info)}
.call .ct{font-weight:700;font-size:.85rem;letter-spacing:.03em;margin-bottom:2px}
.call p{margin:.3em 0}
.call.tip{background:var(--ok-soft);border-color:var(--ok)}
.call.warn{background:var(--bad-soft);border-color:var(--bad)}
.call.key{background:var(--gold-soft);border-color:var(--gold)}
/* code */
.codebox{margin:1em 0;border-radius:12px;overflow:hidden;background:var(--code-bg);box-shadow:var(--shadow)}
.codebar{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 14px;background:rgba(255,255,255,.04);border-bottom:1px solid rgba(255,255,255,.06);font-size:.75rem;color:#8b93a7;font-family:var(--mono)}
.codebar .sp{flex:1}
.codebar button{border:1px solid rgba(255,255,255,.12);background:transparent;color:#c9cfdc;border-radius:7px;padding:3px 9px;font-size:.75rem}
.codebar button:hover{background:rgba(255,255,255,.08)}
pre{margin:0;padding:14px 16px;overflow-x:auto;font-family:var(--mono);font-size:.86rem;line-height:1.55;color:var(--code-ink);tab-size:4}
pre code{background:none;border:0;padding:0;font-size:inherit;color:inherit}
.c-com{color:#7f8aa3;font-style:italic}.c-str{color:#a5e075}.c-pre{color:#f78c6c}.c-num{color:#f9c859}
.c-kw{color:#c792ea;font-weight:600}.c-ty{color:#5ccfe6}.c-fn{color:#82aaff}
/* question */
.q{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:1.5em 0;box-shadow:var(--shadow);position:relative}
.q-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:.78rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.q-tag{background:var(--accent-soft);color:var(--accent);padding:3px 9px;border-radius:999px}
.q-type{color:var(--muted)}
.q-state{margin-left:auto;font-size:.8rem}
.q-text{font-weight:550;margin-bottom:6px}
.q-text p{margin:.3em 0}
.opts{display:grid;gap:8px;margin-top:10px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);padding:9px 12px;border-radius:10px;line-height:1.45;transition:.15s}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt .lt{flex:none;width:24px;height:24px;border-radius:7px;background:var(--panel2);display:grid;place-items:center;font-weight:700;font-size:.8rem;color:var(--ink2)}
.opt.sel{border-color:var(--info);background:var(--info-soft)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .lt{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft);opacity:.85}
.opt.bad .lt{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.fillrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.fill-in,.out-in{flex:1;min-width:200px;font-family:var(--mono);font-size:.92rem;padding:9px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel2);color:var(--ink)}
.out-in{width:100%;min-height:76px;resize:vertical;margin-top:10px;display:block}
.fill-in:focus,.out-in:focus,.task-code:focus,.notes textarea:focus{outline:none;border-color:var(--accent)}
.fill-in.ok,.out-in.ok{border-color:var(--ok);background:var(--ok-soft)}
.fill-in.bad,.out-in.bad{border-color:var(--bad);background:var(--bad-soft)}
.btn{border:0;background:var(--accent);color:#fff;padding:9px 16px;border-radius:10px;font-weight:650;font-size:.92rem;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
[data-theme="dark"] .btn{color:#06201d}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn.coral{background:var(--coral);color:#fff}
.btn.small{padding:6px 11px;font-size:.84rem}
.btn:disabled{opacity:.5;cursor:default}
.q-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.q-fb{margin-top:10px;border-radius:10px;padding:0;font-size:.94rem}
.q-fb:not(:empty){padding:10px 14px}
.q-fb.ok{background:var(--ok-soft);color:var(--ink)}
.q-fb.bad{background:var(--bad-soft);color:var(--ink)}
.q-fb.info{background:var(--info-soft)}
.q-fb b.h{display:block;margin-bottom:2px}
.q-fb .ans{font-family:var(--mono);white-space:pre-wrap;background:var(--panel);border-radius:6px;padding:4px 8px;display:inline-block;margin:4px 0;font-size:.88rem}
.q.solved{border-color:var(--ok)}
.order{list-style:none;padding:0!important;margin:10px 0 0;display:grid;gap:6px}
.order li{display:flex;align-items:center;gap:8px;background:var(--code-bg);color:var(--code-ink);border-radius:9px;padding:5px 6px 5px 12px;font-family:var(--mono);font-size:.85rem;white-space:pre;overflow-x:auto;margin:0!important}
.order li .mv{margin-left:auto;display:flex;gap:4px;flex:none}
.order li .mv button{border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);color:#dfe3ec;border-radius:6px;width:28px;height:26px;font-size:.75rem}
.order li .mv button:hover{background:rgba(255,255,255,.16)}
.order.ok li{outline:2px solid var(--ok)}
.order.bad li{outline:2px solid var(--bad)}
/* task */
.task{border:2px solid var(--gold);background:var(--panel);border-radius:16px;margin:2em 0;overflow:hidden;box-shadow:var(--shadow)}
.task-h{display:flex;align-items:center;gap:10px;padding:12px 18px;background:var(--gold-soft)}
.task-h .ti{font-size:1.3rem}
.task-h .tt{font-family:var(--serif);font-weight:700;font-size:1.15rem;flex:1}
.task-h .tag{font-size:.72rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--gold)}
.task.done{border-color:var(--ok)}
.task.done .task-h{background:var(--ok-soft)}
.task-b{padding:4px 18px 16px}
.task-code{width:100%;min-height:170px;font-family:var(--mono);font-size:.86rem;line-height:1.5;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--code-bg);color:var(--code-ink);resize:vertical;tab-size:4}
.reveal{margin-top:10px}
.reveal > .rv-body{display:none;margin-top:8px}
.reveal.open > .rv-body{display:block}
.chk{display:inline-flex;align-items:center;gap:8px;font-weight:650;cursor:pointer;user-select:none}
.chk input{width:19px;height:19px;accent-color:var(--ok)}
.lbl{font-size:.82rem;font-weight:700;color:var(--ink2);margin:12px 0 4px;display:block}
/* cards */
.hero{background:linear-gradient(135deg,var(--accent) 0%,#0b5f58 100%);color:#fff;border-radius:20px;padding:28px 30px;margin-bottom:22px;position:relative;overflow:hidden}
[data-theme="dark"] .hero{background:linear-gradient(135deg,#115e57 0%,#0b3b37 100%)}
.hero h1{color:#fff;margin:0 0 6px;font-size:2rem}
.hero p{margin:0 0 16px;opacity:.92;max-width:560px}
.hero .btn{background:#fff;color:#0b5f58}
.hero .deco{position:absolute;right:-10px;bottom:-30px;font-family:var(--mono);font-size:9rem;font-weight:800;opacity:.09;line-height:1;pointer-events:none}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:0 0 26px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
.stat .v{font-size:1.6rem;font-weight:800;font-family:var(--serif)}
.stat .k{font-size:.8rem;color:var(--muted);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px;text-decoration:none;color:var(--ink);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;transition:.15s}
.card:hover{transform:translateY(-2px);border-color:var(--accent)}
.card .top-row{display:flex;align-items:center;gap:8px}
.card .ic{font-size:1.5rem}
.card .wk{margin-left:auto;font-family:var(--mono);font-size:.72rem;background:var(--panel2);padding:2px 7px;border-radius:6px;color:var(--ink2);font-weight:700}
.card h4{margin:2px 0 0;font-size:1.12rem}
.card p{margin:0;font-size:.88rem;color:var(--ink2);line-height:1.45;flex:1}
.bar{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden;margin-top:6px}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.card .meta{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);font-weight:600}
.section-t{font-family:var(--serif);font-size:1.4rem;margin:30px 0 12px}
/* lesson nav */
.lnav{display:flex;justify-content:space-between;gap:12px;margin-top:40px;padding-top:20px;border-top:1px solid var(--line);flex-wrap:wrap}
.notes{margin-top:34px;background:var(--panel);border:1px dashed var(--line);border-radius:14px;padding:12px 16px}
.notes summary{cursor:pointer;font-weight:700}
.notes textarea{width:100%;min-height:110px;margin-top:10px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel2);color:var(--ink);font-family:var(--sans);font-size:.95rem;resize:vertical}
.lesson-meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
/* exam */
.exam-head{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow);margin-bottom:10px}
.score-big{font-size:3rem;font-weight:800;font-family:var(--serif);line-height:1}
.sticky-timer{position:sticky;top:66px;z-index:5;display:flex;justify-content:flex-end}
.sticky-timer .pill{font-size:1rem;padding:7px 14px;box-shadow:var(--shadow);background:var(--panel)}
.q .qnum{position:absolute;left:-14px;top:-12px;background:var(--ink);color:var(--bg);font-weight:800;font-size:.78rem;border-radius:8px;padding:2px 8px}
.opts-row{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.opts-row label{display:flex;gap:6px;align-items:center;background:var(--panel);border:1px solid var(--line);padding:6px 10px;border-radius:9px;font-size:.9rem;cursor:pointer}
/* glossary */
.gl-search{width:100%;padding:11px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);font-size:1rem;margin-bottom:14px}
.gl{display:grid;gap:8px}
.gl div{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:10px 14px}
.gl b{font-family:var(--mono);color:var(--accent)}
.gl i{color:var(--muted);font-style:normal;font-size:.85rem}
/* modal / toast */
.modal-bg{position:fixed;inset:0;background:rgba(10,12,20,.55);display:grid;place-items:center;z-index:100;padding:20px}
.modal{background:var(--panel);border-radius:18px;padding:26px 28px;max-width:460px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h2{margin:0 0 6px}
.modal input{width:100%;padding:11px 14px;border-radius:11px;border:1.5px solid var(--line);background:var(--panel2);color:var(--ink);font-size:1.05rem;margin:12px 0}
#toasts{position:fixed;right:18px;bottom:18px;display:grid;gap:8px;z-index:200}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:650;font-size:.92rem;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:tin .25s ease-out}
.toast.gold{background:var(--gold);color:#1b1300}
@keyframes tin{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.confetti{position:fixed;top:-10px;width:9px;height:14px;z-index:300;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.kbd{font-family:var(--mono);font-size:.8rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--panel2)}
.overlay{display:none}
@media (max-width:900px){
  #menuBtn{display:grid}
  .side{transform:translateX(-100%);transition:transform .25s;box-shadow:0 0 40px rgba(0,0,0,.2)}
  body.menu-open .side{transform:none}
  body.menu-open .overlay{display:block;position:fixed;inset:58px 0 0 0;background:rgba(0,0,0,.35);z-index:15}
  main{margin-left:0;padding:80px 16px 100px}
  .pill.lvl,.brand .bt{display:none}
  h2.lesson-title{font-size:1.6rem}
  .q .qnum{left:-6px}
}
@media print{.top,.side,.lnav,.notes,.codebar{display:none!important}main{margin:0;padding:0}}
</style>
</head>
<body>
<header class="top">
  <button class="iconbtn" id="menuBtn" aria-label="Menü">☰</button>
  <a class="brand" href="#/home"><span class="logo">C++</span><span class="bt">C++ Hocam</span></a>
  <div class="spacer"></div>
  <span class="pill fire" id="streakPill" title="Üst üste çalıştığın gün sayısı">🔥 0</span>
  <span class="pill xp" id="xpPill" title="Deneyim puanı">⭐ 0 XP</span>
  <span class="pill lvl" id="lvlPill">Seviye 1</span>
  <button class="iconbtn" id="themeBtn" title="Tema değiştir">🌙</button>
</header>
<nav class="side" id="side"></nav>
<div class="overlay" id="overlay"></div>
<main id="main"><div class="wrap" id="view"></div></main>
<div id="toasts"></div>

<!-- =====================================================================
     DERS İÇERİKLERİ
     Her ünite bir <script type="text/x-unit"> bloğudur.
     === Başlık      -> yeni ders
     === !exam       -> ünite sınavı
     @q mcq|fill|out|order ... @end   -> soru
     @task Başlık ... @end            -> görev
====================================================================== -->

=== Derleyici, Terminal ve Geliştirme Ortamı
### Bilgisayar C++ bilmez!
Yazdığımız kod (`.cpp` dosyası) aslında düz bir metin dosyasıdır. İşlemci bu metni doğrudan çalıştıramaz. Önce bir **derleyici (compiler)** bu metni makine koduna, yani çalıştırılabilir bir dosyaya (`.exe` ya da `a.out`) çevirir.

Hocanın önerdiği ortamlar:
- **Online:** [replit.com](https://replit.com) — kurulum yok, tarayıcıdan yaz-çalıştır. (Ayrıca onlinegdb.com da iş görür.)
- **Windows:** VS Code + w64devkit / MinGW-w64 (içinde `g++` derleyicisi var).
- **Linux / macOS:** `g++` veya `clang++` zaten kurulu ya da kolayca kurulur.

### Derleme ve çalıştırma
Terminalde (komut satırında) şu iki adım yapılır:
```bash
# 1) Derle: main.cpp'yi "program" adlı çalıştırılabilir dosyaya çevir
g++ -o program main.cpp

# 2) Çalıştır
./program          # Linux / macOS / replit
.\program.exe      # Windows

# İkisi birden: derleme başarılıysa hemen çalıştır
g++ -o program main.cpp && ./program
```
`-o` parametresi **çıktı dosyasının adını** belirler. Yazmazsan dosya adı `a.out` (Windows'ta `a.exe`) olur.

> [!TIP] Hocanın tavsiye ettiği bayraklar
> `g++ -std=c++17 -Wall -Wextra main.cpp -o program` — `-std=c++17` modern C++'ı açar, `-Wall -Wextra` olası hataları **uyarı** olarak gösterir. Uyarılar senin dostun!

@q mcq
Q: `g++ -o hesap hesap.cpp` komutunda `-o hesap` ne işe yarar?
A: Kodu optimize eder
A*: Oluşacak çalıştırılabilir dosyanın adını `hesap` yapar
A: hesap.cpp dosyasını açar
A: Programı çalıştırır
E: `-o` (output) çıktı dosyasının adını belirler. Optimizasyon bayrağı `-O2` gibi **büyük O** ile yazılır, karıştırma.
@end

### Temel terminal komutları
Replit'te ya da Linux'ta sık kullanacağın komutlar:

| Komut | Ne yapar? | Örnek |

| `pwd` | Şu an hangi klasördesin? | `pwd` |
| `ls` | Klasördeki dosyaları listeler (Windows: `dir`) | `ls -la` |

@q fill
Q: Linux terminalinde **bir üst klasöre** çıkmak için hangi komutu yazarsın?
ANS: cd .. ;; cd..
E: `cd ..` bir üst dizine çıkar. `..` her zaman "üst klasör" demektir, `.` ise "bulunduğum klasör".
@end

### Derleme 4 aşamada olur
```text
main.cpp
   │ 1) Önişleme (Preprocessing): #include ve #define satırları işlenir
   ▼
   │ 2) Derleme (Compilation): C++ kodu Assembly'ye çevrilir
   ▼
   │ 3) Çevirme (Assembly): Assembly → makine kodu (.o nesne dosyası)
   ▼
   │ 4) Bağlama (Linking): Nesne dosyaları + kütüphaneler birleştirilir
   ▼
program (.exe / a.out)
```

@q order
Q: Bir C++ programının derlenme aşamalarını doğru sıraya diz.
L: Önişleme (Preprocessing) – #include işlenir
L: Derleme (Compilation) – Assembly üretilir
L: Çevirme (Assembly) – .o nesne dosyası üretilir
L: Bağlama (Linking) – çalıştırılabilir dosya üretilir
E: Sıra: önişlemci → derleyici → assembler → linker. "Undefined reference" hatası görürsen o hata **linker** aşamasındandır.
@end

=== İlk Programın Anatomisi
### Merhaba Dünya
```cpp
// Giriş-çıkış kütüphanesini dahil ediyoruz
#include <iostream>

// Standart isim alanını kullanıyoruz
using namespace std;

// Program buradan başlar
int main() {
    // cout ile ekrana yazdırırız
    cout << "Merhaba Dunya! KTU Bilgisayar Muhendisligi\n";
    return 0;   // "program başarıyla bitti" demek
}
```
Satır satır inceleyelim:
1. `#include <iostream>` — `cout`, `cin` gibi giriş/çıkış araçlarını getiren **başlık dosyasını** ekler. `#` ile başlayan satırlar **önişlemci** komutudur, sonlarına `;` konmaz.
2. `using namespace std;` — Standart kütüphanedeki her şey `std` isim alanındadır. Bu satır olmasaydı her seferinde `std::cout` yazmamız gerekirdi.
3. `int main()` — Her C++ programının **giriş kapısı**. İşletim sistemi programı buradan başlatır.
4. `cout << ...` — `<<` operatörü (akışa ekleme) sağdaki değeri ekrana gönderir. Peş peşe zincirlenebilir.
5. `return 0;` — İşletim sistemine "hatasız bitti" mesajı verir.

@q mcq
Q: `using namespace std;` satırını silersek `cout` kullanmak için ne yapmalıyız?
A: Hiçbir şey, cout yine çalışır
A: `#include <std>` eklemeliyiz
A*: `std::cout` şeklinde yazmalıyız
A: `cout` yerine `printf` kullanmak zorundayız
E: `cout`, `std` isim alanının içindedir. `using namespace std;` yoksa tam adıyla `std::cout`, `std::endl` yazılır. `::` operatörüne "kapsam çözünürlük operatörü" denir.
@end

### Yeni satır: `\n` mi, `endl` mi?
İkisi de alt satıra geçer. Fark şu:
- `"\n"` sadece yeni satır karakteridir — **hızlıdır**.
- `endl` yeni satıra geçer **ve** çıktı tamponunu (buffer) hemen boşaltır (flush). Çok tekrar eden döngülerde programı yavaşlatabilir.

```cpp
cout << "Ad: " << "Asli" << endl;      // zincirleme yazdırma
cout << "Bolum: " << "Bilgisayar\n";   // \n ile yeni satır
cout << "A" << "B";                    // alt satıra geçmez
cout << "C" << endl;                   // çıktı: ABC
```

@q out
Q: Bu kodun ekran çıktısı nedir?
```cpp
#include <iostream>
using namespace std;
int main() {
    cout << "Bir" << "Iki" << endl;
    cout << "Uc\n" << "Dort";
    cout << "Bes" << endl;
    return 0;
}
```
ANS: BirIki\nUc\nDortBes
E: İlk satırda araya boşluk konmadığı için `BirIki` bitişik yazılır. `Uc\n` sonrası alt satıra geçilir; `Dort` ile `Bes` arasında yeni satır olmadığı için bitişik: `DortBes`.
@end

=== Yazım Kuralları (Syntax)
### 1) Her ifade `;` ile biter
```cpp
int x = 10;
x = x + 5;
cout << x << endl;
```
Noktalı virgül unutmak en sık yapılan derleme hatasıdır: `error: expected ';' before ...`

### 2) Bloklar `{ }` ile yazılır
Birlikte çalışan ifadeler süslü parantez içine alınır. Bir blok içinde tanımlanan değişken, blok bitince **yok olur**.
```cpp
{
    int yerel = 50;
    cout << yerel << endl;
}
// burada 'yerel' artık yok, kullanırsan derleme hatası!
```

### 3) Yorum satırları
```cpp
// Tek satırlık yorum

/* Çok satırlı
   yorum */
```
Yorumlar derleyici tarafından tamamen yok sayılır.

### 4) İsimlendirme kuralları (identifiers)
- Harf veya `_` ile başlamalı. **Rakamla başlayamaz** (`sayi1` ✓, `1sayi` ✗).
- Boşluk ve özel karakter içeremez (`ogrenci-notu` ✗, `ogrenci_notu` ✓, `fiyat$` ✗).
- **Büyük/küçük harfe duyarlıdır:** `toplam`, `Toplam`, `TOPLAM` üç farklı isimdir.
- Anahtar kelimeler (`int`, `class`, `return`, `if`...) isim olamaz.
- Türkçe karakter (ç, ş, ğ, ı, ö, ü) **kullanma**; bazı derleyiciler hata verir.

@q mcq
Q: Aşağıdakilerden hangisi **geçerli** bir değişken adıdır?
A: `2sayi`
A: `ogrenci-notu`
A*: `_toplam2`
A: `float`
E: `_toplam2` alt çizgiyle başlıyor, sonrasında harf ve rakam var — geçerli. `2sayi` rakamla başlıyor, `ogrenci-notu` içinde `-` var (eksi operatörü sanılır), `float` bir anahtar kelime.
@end

@q mcq
Q: `int Sayi = 5;` tanımından sonra `cout << sayi;` yazarsak ne olur?
A: 5 yazar
A: 0 yazar
A*: Derleme hatası: `sayi` tanımlı değil
A: Rastgele bir sayı yazar
E: C++ büyük/küçük harfe duyarlıdır. `Sayi` ve `sayi` farklı isimlerdir; `sayi` hiç tanımlanmadığı için `'sayi' was not declared in this scope` hatası alırsın.
@end

### 5) Boşluklar önemsizdir ama okunabilirlik önemlidir
C++ "serbest biçimli" bir dildir; derleyici girintiye (indentation) bakmaz. Ama sen ve hocan bakarsınız! Her `{` sonrası içeriği 4 boşluk içeri al.

@task Kendini Tanıtan Program
`cout` kullanarak ekrana aşağıdaki gibi bir **tanıtım kartı** yazdıran programı yaz. Kendi bilgilerini kullan:
```text
*****************************
*  Ad Soyad : Asli ...      *
*  Bolum    : Bilgisayar    *
*  Ders     : NYP (C++)     *
*****************************
```
- En az bir yerde `endl`, en az bir yerde `\n` kullan.
- Kodun başına yorum satırıyla adını ve tarihi yaz.
HINT: Her satır için ayrı bir `cout` yazabilirsin ya da tek `cout` ile `<<` zincirleyebilirsin.
HINT: Ekranda `"` göstermek istersen `\"` yazmalısın.
SOL:
```cpp
// Asli - 2026 - Tanitim karti
#include <iostream>
using namespace std;

int main() {
    cout << "*****************************" << endl;
    cout << "*  Ad Soyad : Asli Yilmaz    *\n";
    cout << "*  Bolum    : Bilgisayar    *\n";
    cout << "*  Ders     : NYP (C++)     *" << endl;
    cout << "*****************************\n";
    return 0;
}
```
@end

=== Temel Algoritma Kalıpları
Hocanın "her mühendisin refleks gibi bilmesi gereken" dediği kalıplar bunlar. Şimdilik mantığını kavra; döngüleri ve dizileri öğrendikçe tekrar tekrar kullanacağız.

### Toplam ve çarpım (biriktirme)
```cpp
int toplam = 0;      // toplamanın etkisiz elemanı 0
long long carpim = 1; // çarpmanın etkisiz elemanı 1
for (int i = 0; i < n; i++) {
    toplam += dizi[i];
    carpim *= dizi[i];
}
```
> [!WARN]
> Çarpımı `0` ile başlatırsan sonuç hep `0` olur! Toplam → 0, çarpım → 1 ile başlar.

### Ortalama — tip dönüşümüne dikkat
```cpp
double ortalama = static_cast<double>(toplam) / n;
```
`toplam / n` ikisi de `int` ise **tamsayı bölmesi** olur ve küsurat kaybolur (7/2 = 3). Birini `double`'a çevirmek gerekir.

### En büyük / en küçük bulma
```cpp
int enb = dizi[0];            // ilk elemanı "şimdilik en büyük" kabul et
for (int i = 1; i < n; i++) {
    if (dizi[i] > enb) enb = dizi[i];
}
```

### Sayma ve doğrusal arama
```cpp
int adet = 0;
for (int i = 0; i < n; i++)
    if (dizi[i] % 2 == 0) adet++;   // çift sayıları say

int dogrusalArama(const int dizi[], int n, int aranan) {
    for (int i = 0; i < n; i++)
        if (dizi[i] == aranan) return i;   // bulundu → indeksi döndür
    return -1;                              // bulunamadı
}
```

@q mcq
Q: Bir dizideki elemanların **çarpımını** bulurken `carpim` değişkeni hangi değerle başlatılmalı?
A: 0
A*: 1
A: dizinin son elemanı
A: Başlatmaya gerek yok
E: Çarpmanın etkisiz elemanı 1'dir. 0 ile başlarsa her şey 0 olur; hiç başlatmazsan da içinde "çöp değer" olur.
@end

@q out
Q: Aşağıdaki kodun çıktısı nedir?
```cpp
int a = 7, b = 2;
double c = a / b;
double d = static_cast<double>(a) / b;
cout << "c: " << c << ", d: " << d << endl;
```
ANS: c: 3, d: 3.5
E: `a / b` iki int olduğu için tamsayı bölmesi → 3, sonra `double`'a 3.0 olarak atanır ve `cout` bunu `3` diye yazar. `d` hesabında `a` önce 7.0 yapılır, sonuç 3.5 olur.
@end

@task İkinci En Büyük Eleman (Hocanın ödevi)
`int dizi[] = {12, 45, 7, 45, 30, 9};` dizisindeki **ikinci en büyük farklı** elemanı bulup yazdır (cevap: 30).
- Diziyi sıralamak yasak, **tek döngü** kullan.
- Tüm elemanlar aynıysa "ikinci en büyük yok" yazdır.
*(Döngü ve dizileri henüz görmediysen bu görevi Hafta 2 ve 5'ten sonra tekrar dene.)*
HINT: İki değişken tut: `enb` ve `ikinci`. Yeni sayı `enb`'den büyükse eski `enb` → `ikinci` olur.
HINT: Sayı `enb`'ye eşitse atla; `enb`'den küçük ama `ikinci`'den büyükse sadece `ikinci` güncellenir.
SOL:
```cpp
#include <iostream>
#include <climits>
using namespace std;

int main() {
    int dizi[] = {12, 45, 7, 45, 30, 9};
    int n = sizeof(dizi) / sizeof(dizi[0]);
    int enb = INT_MIN, ikinci = INT_MIN;
    for (int i = 0; i < n; i++) {
        if (dizi[i] > enb) {
            ikinci = enb;
            enb = dizi[i];
        } else if (dizi[i] < enb && dizi[i] > ikinci) {
            ikinci = dizi[i];
        }
    }
    if (ikinci == INT_MIN) cout << "Ikinci en buyuk yok\n";
    else cout << "Ikinci en buyuk: " << ikinci << endl;
    return 0;
}
```
@end

<script type="text/x-unit" data-id="degisken" data-week="Hafta 1" data-icon="🧮" data-title="Değişkenler, Veri Tipleri ve Operatörler" data-desc="int, double, char, bool; değişken tanımlama, kapsam (scope), sabitler, operatörler ve tip dönüşümleri.">
=== Veri Tipleri ve Bellek
### C++ statik tipli bir dildir
Bir değişken tanımlarken **türünü mutlaka belirtirsin** ve bu tür bir daha değişmez. Tür, değişkenin bellekte ne kadar yer kaplayacağını ve hangi değerleri alabileceğini belirler.

| Tip | Boyut (tipik) | Ne tutar? |
|---|---|---|
| `bool` | 1 byte | `true` (1) / `false` (0) |
| `char` | 1 byte | Tek karakter ya da küçük tamsayı (-128..127) |
| `short` | 2 byte | -32 768 .. 32 767 |
| `int` | 4 byte | yaklaşık ±2.14 milyar |
| `long long` | 8 byte | yaklaşık ±9.2 × 10^18 |
| `float` | 4 byte | ~7 basamak hassasiyetli ondalık |
| `double` | 8 byte | ~15 basamak hassasiyetli ondalık |
| `unsigned int` | 4 byte | 0 .. ~4.29 milyar (negatif yok) |

`sizeof` operatörü bir türün ya da değişkenin kaç byte olduğunu söyler:
```cpp
#include <iostream>
using namespace std;

int main() {
    bool aktif = true;
    char harf = 'A';          // ASCII kodu 65
    int sayi = -500;
    double pi = 3.1415926535;

    cout << "bool  : " << sizeof(aktif) << " byte\n";
    cout << "char  : " << sizeof(harf) << " byte, ASCII: " << int(harf) << "\n";
    cout << "int   : " << sizeof(sayi) << " byte\n";
    cout << "double: " << sizeof(pi) << " byte\n";
    cout << aktif << endl;    // bool ekrana 1 olarak yazılır
    return 0;
}
```

### char aslında bir sayıdır
Her karakterin bir **ASCII** kodu vardır: `'A'` = 65, `'B'` = 66, `'a'` = 97, `'0'` = 48. Bu yüzden karakterlerle aritmetik yapılabilir. Büyük ve küçük harf arasındaki fark **32**'dir (hoca derste `#define DIFF 32` ile bunu kullandı).

@q out
Q: Çıktı nedir?
```cpp
char c = 'A';
char d = c + 2;
cout << int(c) << " " << d << endl;
```
ANS: 65 C
E: `'A'`'nın ASCII kodu 65'tir. `c + 2` = 67, bu da `'C'` karakteridir. `d` bir `char` olduğu için harf olarak yazılır.
@end

@q out
Q: Çıktı nedir?
```cpp
char k = 'a';
cout << char(k - 32) << endl;
```
ANS: A
E: 'a' = 97, 97 − 32 = 65 = 'A'. Küçük harfi büyüğe çevirme hilesi.
@end

> [!WARN] Taşma (overflow)
> `int` sınırını aşarsan sonuç bozulur (tanımsız davranış). `unsigned` türlerde sınırı aşınca değer başa döner: `unsigned short s = 65535; s++;` → `s` artık `0`.

@q mcq
Q: Tipik bir derleyicide `sizeof(int)` kaç döner?
A: 1
A: 2
A*: 4
A: 8
E: Günümüz sistemlerinde `int` genellikle 4 byte = 32 bit'tir.
@end

=== Değişken Tanımlama ve Kapsam (Scope)
### Tanımlama ve başlatma yolları
```cpp
int a;          // sadece bildirim: içinde ÇÖP (garbage) değer var!
a = 10;         // atama

int b = 20;     // kopyalama ile başlatma
int c(30);      // doğrudan başlatma
int d{40};      // süslü parantez (uniform) başlatma - C++11
int x = 1, y = 2, z;   // aynı satırda birden çok
```
> [!WARN]
> Yerel bir değişkeni başlatmadan kullanırsan içinden rastgele bir sayı çıkar. **Her zaman ilk değer ver.**

### `{ }` ile başlatmanın süper gücü: daraltma engeli
```cpp
int x = 3.14;    // derlenir, x = 3 olur (sessizce veri kaybı)
int y{3.14};     // HATA! double'dan int'e daraltmaya izin vermez
```

@q mcq
Q: `int y{9.99};` satırı için ne söylenebilir?
A: y = 9 olur
A: y = 10 olur
A*: Derleme hatası verir (narrowing conversion)
A: y = 9.99 olur
E: Süslü parantezli başlatma veri kaybına (daraltıcı dönüşüme) izin vermez. `int y = 9.99;` yazsaydın 9 olurdu.
@end

### İsimlendirme stilleri
- `camelCase` → `ogrenciNotu`, `toplamFiyat` (değişkenlerde yaygın)
- `snake_case` → `ogrenci_notu` (standart kütüphane tarzı)
- `PascalCase` → `OgrenciNotu` (sınıf isimlerinde)

### Yerel ve global değişkenler
- **Global** değişken: tüm fonksiyonların dışında tanımlanır, her yerden erişilir. Başlatılmazsa otomatik **0** olur.
- **Yerel** değişken: bir blok `{}` içinde tanımlanır, sadece orada yaşar.
- Aynı isimde yerel değişken varsa global olanı **gölgeler** (shadowing). Globale yine de `::isim` ile ulaşılır.

```cpp
#include <iostream>
using namespace std;

int sayi = 100;            // GLOBAL

void fonksiyon() {
    int sayi = 50;         // yerel, globali gölgeler
    cout << sayi << " " << ::sayi << endl;   // 50 100
}

int main() {
    int sayi = 20;
    cout << sayi << endl;      // 20
    cout << ::sayi << endl;    // 100
    fonksiyon();
    return 0;
}
```
> [!HOCA]
> Derste `const float mC = 0.4, fC = 0.6;` global sabitlerini fonksiyon içinde `::mC * a + ::fC * b` şeklinde kullandık. Fonksiyonda aynı isimli yerel `mC` olsa bile `::mC` globali verir.

@q out
Q: Çıktı nedir?
```cpp
#include <iostream>
using namespace std;
int x = 5;
int main() {
    int x = 8;
    {
        int x = 12;
        cout << x << " ";
    }
    cout << x << " " << ::x << endl;
    return 0;
}
```
ANS: 12 8 5
E: İç blokta en yakın `x` = 12. Blok bitince o `x` yok olur, main'in `x`'i = 8. `::x` her zaman global = 5.
@end

=== Sabitler ve Değişmezler (Literals)
### `const` ve `#define`
```cpp
#define PI_MAKRO 3.14159          // önişlemci: metni yerine koyar, tip yok
const double PI = 3.14159;        // tip güvenli sabit
constexpr int BOYUT = 10 * 5;     // derleme anında hesaplanır (C++11)
```
`const` bir değişkene sonradan değer atanamaz:
```cpp
const int MAX = 100;
MAX = 200;   // HATA: assignment of read-only variable
```
> [!TIP]
> Modern C++'ta `#define` yerine `const` / `constexpr` tercih edilir; tip kontrolünden geçer ve kapsam kurallarına uyar. Ama hocanın kodlarında `#define` de göreceksin, ikisini de tanı.

### Değişmezler (literals)
- Tamsayı: `42` (onluk), `052` (sekizlik — başında 0), `0x2A` (onaltılık), `0b101010` (ikili)
- Sonekler: `42U` unsigned, `42L` long, `3.14f` float, `3.14` double
- Karakter `'A'` (tek tırnak), metin `"Merhaba"` (çift tırnak)

### Kaçış karakterleri
| Yazılış | Anlamı |
|---|---|
| `\n` | yeni satır |
| `\t` | tab (sekme) |
| `\\` | ters eğik çizgi |
| `\"` | çift tırnak |
| `\'` | tek tırnak |
| `\0` | null karakter (C-string sonu) |

@q out
Q: Çıktı nedir?
```cpp
cout << 0x1F << " " << 010 << " " << 0b11 << endl;
```
ANS: 31 8 3
E: `0x1F` = 1×16 + 15 = 31. `010` sekizlik = 8 (başındaki 0'a dikkat!). `0b11` ikili = 3.
@end

@q mcq
Q: Ekrana `Dosya: "C:\notlar"` yazdırmak için hangisi doğrudur?
A: `cout << "Dosya: "C:\notlar"";`
A*: `cout << "Dosya: \"C:\\notlar\"";`
A: `cout << 'Dosya: "C:\notlar"';`
A: `cout << "Dosya: \"C:\notlar\"";`
E: Çift tırnak `\"`, ters eğik çizgi `\\` ile yazılır. Son seçenekte `\n` yeni satır olarak yorumlanır!
@end

=== Operatörler
### Aritmetik
`+  -  *  /  %`  — `%` **mod** (kalan) sadece tamsayılarda çalışır.
```cpp
cout << 17 / 5;    // 3   (tamsayı bölmesi)
cout << 17 % 5;    // 2   (kalan)
cout << 17.0 / 5;  // 3.4 (biri double ise ondalıklı bölme)
```

@q out
Q: Çıktı nedir?
```cpp
cout << 23 / 4 << " " << 23 % 4 << " " << 23.0 / 4 << endl;
```
ANS: 5 3 5.75
E: 23/4 tamsayı bölmesi = 5, kalan 3. 23.0/4 = 5.75.
@end

### Artırma / azaltma: ön ek ve son ek
```cpp
int a = 5;
int b = ++a;   // ÖN artırma: önce a=6, sonra b=6
int x = 5;
int y = x++;   // SON artırma: önce y=5 (eski değer), sonra x=6
```
Bileşik atama: `x += 3` (x = x + 3), `x -= 2`, `x *= 4`, `x /= 2`, `x %= 5`.

@q out
Q: Hocanın klasik sorusu! Çıktı nedir?
```cpp
int a = 10;
int b = 20;
int c = a++ + ++b;
cout << "a: " << a << ", b: " << b << ", c: " << c << endl;
```
ANS: a: 11, b: 21, c: 31
E: `++b` önce b'yi 21 yapar. `a++` işlemde eski değer 10'u kullanır, sonra a 11 olur. c = 10 + 21 = 31.
@end

### İlişkisel ve mantıksal
- İlişkisel: `==  !=  <  >  <=  >=` → sonuç `bool` (true/false).
- Mantıksal: `&&` (VE), `||` (VEYA), `!` (DEĞİL).

| A | B | A && B | A \|\| B |
|---|---|---|---|
| true | true | true | true |
| true | false | false | true |
| false | true | false | true |
| false | false | false | false |

**Kısa devre (short-circuit):** `false && ...` ifadesinde sağ taraf hiç hesaplanmaz, çünkü sonuç zaten `false`. Aynı şekilde `true || ...` için sağ taraf atlanır.

@q out
Q: Çıktı nedir? (Kısa devreye dikkat)
```cpp
int k = 0;
bool s = (k > 5) && (++k > 0);
cout << s << " " << k << endl;
```
ANS: 0 0
E: `k > 5` false olduğu için `&&` kısa devre yapar; `++k` hiç çalışmaz, k = 0 kalır. bool false ekrana 0 olarak yazılır.
@end

### Bitsel operatörler (kısa)
Sayıların ikili bitleri üzerinde çalışır: `&` (AND), `|` (OR), `^` (XOR), `~` (NOT), `<<` (sola kaydır = ×2), `>>` (sağa kaydır = ÷2).
```cpp
// 5 = 0101, 3 = 0011
cout << (5 & 3);   // 0001 = 1
cout << (5 | 3);   // 0111 = 7
cout << (5 ^ 3);   // 0110 = 6
cout << (1 << 3);  // 1000 = 8
```

@q out
Q: Çıktı nedir?
```cpp
cout << (6 & 3) << " " << (6 | 3) << " " << (6 ^ 3) << " " << (6 >> 1) << endl;
```
ANS: 2 7 5 3
E: 6 = 110, 3 = 011. AND: 010 = 2, OR: 111 = 7, XOR: 101 = 5. 6 >> 1 = 3.
@end

### Öncelik sırası (kabaca)
`()` → `++ -- !` → `* / %` → `+ -` → `<< >>` → `< > <= >=` → `== !=` → `&&` → `||` → `?:` → `= += ...`
Emin değilsen **parantez kullan**.

@q out
Q: Çıktı nedir?
```cpp
int s = 2 + 3 * 4 % 5 - 6 / 4;
cout << s << endl;
```
ANS: 3
E: Önce `* / %` soldan sağa: 3*4 = 12, 12 % 5 = 2, 6/4 = 1. Sonra 2 + 2 − 1 = 3.
@end

=== Tip Dönüşümleri (Casting)
### Örtük (otomatik) dönüşüm
Farklı türler karışınca küçük tür büyüğe yükseltilir:
```cpp
int sayi = 10;
double sonuc = sayi + 5.5;   // sayi → 10.0, sonuç 15.5
int k = 9.8;                 // double → int: kesirli kısım ATILIR, k = 9 (yuvarlanmaz!)
```

### Açık (explicit) dönüşüm
```cpp
double pi = 3.14159;
int a = (int)pi;                 // C tarzı
int b = int(pi);                 // fonksiyon tarzı
int c = static_cast<int>(pi);    // C++ tarzı - önerilen, güvenli
```

### C++'ın 4 cast operatörü
| Operatör | Ne için? | Güvenlik |
|---|---|---|
| `static_cast` | Uyumlu türler arası normal dönüşüm (int↔double...) | Yüksek |
| `dynamic_cast` | Kalıtımda çalışma zamanında güvenli dönüşüm (ileride) | Çok yüksek |
| `const_cast` | Bir göstericinin `const` niteliğini kaldırma | Riskli |
| `reinterpret_cast` | Bitleri bambaşka türmüş gibi okuma | Tehlikeli |

```cpp
int sayi = 100;
const int* cp = &sayi;
int* p = const_cast<int*>(cp);   // const kaldırıldı
*p = 250;                        // sayi artık 250

int x = 65;
char* bp = reinterpret_cast<char*>(&x);
cout << *bp;                     // ilk byte 65 → 'A' yazar
```
> [!WARN]
> Değişkenin kendisi baştan `const int sayi = 100;` diye tanımlanmışsa, `const_cast` ile değiştirmeye çalışmak **tanımsız davranıştır**.

### `auto` ile tür çıkarımı
```cpp
auto x = 5;      // int
auto y = 3.14;   // double
auto z = 'K';    // char
```

@q mcq
Q: Bir `double` değeri `int`'e çevirmek için önerilen C++ yöntemi hangisidir?
A: `const_cast<int>(d)`
A*: `static_cast<int>(d)`
A: `reinterpret_cast<int>(d)`
A: `dynamic_cast<int>(d)`
E: Sıradan sayısal dönüşümler için `static_cast` kullanılır.
@end

@q out
Q: Çıktı nedir?
```cpp
double d = 7.99;
int i = d;
double r = i / 2;
cout << i << " " << r << " " << i / 2.0 << endl;
```
ANS: 7 3 3.5
E: 7.99 → int'e atanınca 7 (yuvarlanmaz, kesilir). `i / 2` = 3 (tamsayı bölmesi) sonra double'a 3 olarak atanır. `i / 2.0` = 3.5.
@end

@task İki Değişkeni Geçici Değişkensiz Takas Et
`int a = 7, b = 12;` değerlerini **üçüncü bir değişken kullanmadan** yer değiştir. İki yöntemle yap:
1. Aritmetik (`+` ve `-`) ile
2. Bitsel XOR (`^`) ile

Her yöntemden sonra `a` ve `b`'yi yazdır.
HINT: Aritmetik: `a = a + b; b = a - b; a = a - b;`
HINT: XOR'un özelliği: `x ^ x = 0` ve `x ^ 0 = x`.
SOL:
```cpp
#include <iostream>
using namespace std;

int main() {
    int a = 7, b = 12;
    // 1) aritmetik
    a = a + b;   // 19
    b = a - b;   // 7
    a = a - b;   // 12
    cout << "Aritmetik: a=" << a << " b=" << b << endl;

    // 2) XOR (tekrar takas edip eski haline döndürelim)
    a = a ^ b;
    b = a ^ b;
    a = a ^ b;
    cout << "XOR: a=" << a << " b=" << b << endl;
    return 0;
}
```
@end

@task Sıcaklık Dönüştürücü
Kullanıcıdan Celsius cinsinden bir sıcaklık al (`double`). Fahrenheit (`F = C * 9 / 5 + 32`) ve Kelvin (`K = C + 273.15`) değerlerini yazdır. Ayrıca sıcaklığın `int`'e dönüştürülmüş halini ve ne kadar kayıp olduğunu yazdır.
- Dikkat: `9 / 5` yazarsan sonuç ne olur? Neden?
HINT: `9 / 5` tamsayı bölmesi olduğu için 1 olur! `9.0 / 5` yaz.
HINT: Kayıp = `c - static_cast<int>(c)`
SOL:
```cpp
#include <iostream>
using namespace std;

int main() {
    double c;
    cout << "Celsius: ";
    cin >> c;
    double f = c * 9.0 / 5 + 32;
    double k = c + 273.15;
    int tam = static_cast<int>(c);
    cout << "Fahrenheit: " << f << endl;
    cout << "Kelvin    : " << k << endl;
    cout << "int hali  : " << tam << " (kayip: " << c - tam << ")" << endl;
    return 0;
}
```
@end

<script type="text/x-unit" data-id="kosul" data-week="Hafta 2" data-icon="🔀" data-title="Koşullar: if-else ve switch" data-desc="Programın karar vermesi: if, else-if merdiveni, iç içe koşullar, switch-case menüleri ve ?: operatörü.">
=== if ve if-else
### Program karar verebilir
`if` parantez içindeki koşulu test eder. Koşul **doğru** (true / sıfırdan farklı) ise blok çalışır; değilse `else` bloğu çalışır.
```cpp
#include <iostream>
using namespace std;

int main() {
    double vize, final;
    cout << "Vize notu : "; cin >> vize;
    cout << "Final notu: "; cin >> final;

    double ort = vize * 0.4 + final * 0.6;   // %40 vize, %60 final
    cout << "Ortalama: " << ort << endl;

    if (ort < 50) {
        cout << "KALDI\n";
    } else {
        cout << "GECTI, tebrikler!\n";
    }
    return 0;
}
```

### Sıfır = yanlış, sıfır olmayan = doğru
C++'ta koşul olarak bir sayı da yazılabilir: `0` → false, diğer her şey → true.
```cpp
int n = -3;
if (n) cout << "n sifir degil\n";   // çalışır
```

### Büyük tuzak: `=` ile `==`
```cpp
int x = 0;
if (x = 5) {           // DİKKAT: karşılaştırma değil ATAMA!
    cout << "Evet\n";  // x 5 oldu, 5 de true → her zaman çalışır
}
```
`==` karşılaştırır, `=` atar. `-Wall` ile derlersen derleyici seni uyarır.

@q out
Q: Çıktı nedir?
```cpp
int x = 0;
if (x = 0)
    cout << "A";
else
    cout << "B";
cout << x;
```
ANS: B0
E: `x = 0` bir atamadır; ifadenin değeri 0 → false. Bu yüzden else çalışır: `B`. Sonra x (0) yazılır.
@end

### Süslü parantezsiz if
Gövdede tek komut varsa `{}` zorunlu değildir — ama sadece **ilk** komut if'e aittir!
```cpp
if (puan > 90)
    cout << "Harika ";
    cout << "Bitti";     // Bu satır if'e AİT DEĞİL, her zaman çalışır!
```
> [!TIP]
> İyi alışkanlık: **her zaman süslü parantez kullan.** Hem okunabilir olur hem de "dangling else" (sallanan else) karışıklığı yaşamazsın.

@q out
Q: `puan = 50` iken çıktı nedir?
```cpp
int puan = 50;
if (puan > 90)
    cout << "Harika ";
    cout << "Bitti";
```
ANS: Bitti
E: Süslü parantez olmadığı için sadece ilk `cout` if'e bağlıdır. "Bitti" her durumda yazılır.
@end

=== else-if Merdiveni
İkiden fazla seçenek varsa `if – else if – else` kullanılır. Koşullar **yukarıdan aşağı** sırayla denenir, **ilk doğru olan** çalışır ve yapıdan çıkılır.
```cpp
int notDegeri;
cin >> notDegeri;

if (notDegeri >= 90)      cout << "AA\n";
else if (notDegeri >= 80) cout << "BA\n";
else if (notDegeri >= 70) cout << "BB\n";
else if (notDegeri >= 60) cout << "CB\n";
else if (notDegeri >= 50) cout << "CC\n";
else                      cout << "FF\n";
```
85 girilirse: `>= 90` yanlış, `>= 80` doğru → `BA` yazar ve biter. Alttaki `>= 70`'e hiç bakılmaz (85 ondan da büyük olduğu halde).

@q out
Q: `notDegeri = 72` için yukarıdaki kod ne yazar?
ANS: BB
@end

### Sıra önemlidir!
```cpp
if (n >= 50)      cout << "CC";
else if (n >= 90) cout << "AA";   // ASLA çalışmaz!
```

@q mcq
Q: Yukarıdaki hatalı sıralamada `n = 95` olursa ne yazılır?
A: AA
A*: CC
A: CCAA
A: Hiçbir şey
E: 95 ≥ 50 olduğu için ilk koşul doğru → "CC" yazılır ve merdivenden çıkılır. Bu yüzden büyükten küçüğe sıralamak gerekir.
@end

@q mcq
Q: Aşağıdaki iki yapı arasındaki fark nedir?
```cpp
// Yapı 1                // Yapı 2
if (x > 0) a++;          if (x > 0) a++;
if (x > 5) a++;          else if (x > 5) a++;
```
A: Hiçbir fark yok
A*: x = 10 için Yapı 1'de a iki kez, Yapı 2'de bir kez artar
A: Yapı 2 derleme hatası verir
A: x = 10 için ikisinde de a iki kez artar
E: Ayrı ayrı `if`'ler hepsi kontrol edilir. `else if` ise önceki doğru çıkarsa hiç kontrol edilmez.
@end

=== İç İçe Koşullar ve Mantıksal Operatörler
### Nested if
```cpp
int yas; bool ehliyet;
cin >> yas >> ehliyet;

if (yas >= 18) {
    if (ehliyet) {
        cout << "Arac kiralayabilirsiniz.\n";
    } else {
        cout << "Yasiniz uygun ama ehliyetiniz yok.\n";
    }
} else {
    cout << "18 yasindan kucuksunuz.\n";
}
```
Aynı kontrol `&&` ile tek satırda: `if (yas >= 18 && ehliyet) { ... }`

### Klasik örnek: Artık yıl
Bir yıl artık yıldır ⇔ **4'e tam bölünür VE 100'e bölünmez**, **YA DA** 400'e tam bölünür.
```cpp
int yil; cin >> yil;
bool artik = (yil % 4 == 0 && yil % 100 != 0) || (yil % 400 == 0);
int yuzyil = (yil - 1) / 100 + 1;    // 2026 → 21. yüzyıl, 2000 → 20. yüzyıl
cout << yil << " " << yuzyil << ". yuzyil, "
     << (artik ? "artik yil" : "artik yil degil") << endl;
```
> [!HOCA]
> Hocanın "kendini geliştirme" örneği: yılı al, yüzyılını hesapla ve artık yıl olup olmadığını söyle. Görev olarak aşağıda!

@q mcq
Q: Hangi yıl artık yıl **değildir**?
A: 2024
A: 2000
A*: 1900
A: 1600
E: 1900 4'e ve 100'e bölünür ama 400'e bölünmez → artık yıl değil. 2000 ve 1600 400'e bölündüğü için artık yıldır.
@end

@q fill
Q: `x` sayısının 10 ile 20 arasında (ikisi dahil) olup olmadığını kontrol eden koşulu yaz: `if ( ______ )`
ANS: x >= 10 && x <= 20 ;; x>=10&&x<=20 ;; (x >= 10) && (x <= 20) ;; 10 <= x && x <= 20 ;; x <= 20 && x >= 10
E: Matematikteki gibi `10 <= x <= 20` yazamazsın! C++ bunu `(10 <= x) <= 20` diye okur ve sonuç hep true çıkar.
@end

@task Artık Yıl ve Yüzyıl (Hocanın örneği)
Kullanıcıdan bir yıl al (`int`). Ekrana:
- yılın kaçıncı yüzyılda olduğunu (ör. 2026 → 21, 2000 → 20, 1901 → 20),
- artık yıl olup olmadığını yazdır.
Negatif ya da 0 girilirse "Gecersiz yil" yazdır.
HINT: Yüzyıl formülü: `(yil - 1) / 100 + 1` (tamsayı bölmesi işini görür)
HINT: Artık yıl: `(yil % 4 == 0 && yil % 100 != 0) || yil % 400 == 0`
SOL:
```cpp
#include <iostream>
using namespace std;

int main() {
    int yil;
    cout << "Yil giriniz: ";
    cin >> yil;
    if (yil <= 0) {
        cout << "Gecersiz yil\n";
        return 1;
    }
    int yuzyil = (yil - 1) / 100 + 1;
    bool artik = (yil % 4 == 0 && yil % 100 != 0) || (yil % 400 == 0);
    cout << yil << " yili " << yuzyil << ". yuzyildadir." << endl;
    if (artik) cout << "Artik yildir (Subat 29 gun).\n";
    else       cout << "Artik yil degildir.\n";
    return 0;
}
```
@end

=== switch-case
Tek bir değişkenin **tam eşit** olduğu sabitlere göre dallanmak için kullanılır. Menüler için idealdir.
```cpp
int secim;
double a, b;
cout << "1-Topla 2-Cikar 3-Carp 4-Bol: ";
cin >> secim;
cout << "Iki sayi: ";
cin >> a >> b;

switch (secim) {
    case 1:
        cout << a + b << endl;
        break;            // switch'ten çık
    case 2:
        cout << a - b << endl;
        break;
    case 3:
        cout << a * b << endl;
        break;
    case 4:
        if (b != 0) cout << a / b << endl;
        else        cout << "Sifira bolunmez!\n";
        break;
    default:              // hiçbir case tutmazsa
        cout << "Gecersiz secim\n";
}
```

### Kurallar
- `switch(...)` içine **tamsayı, char veya enum** yazılır. `double` ve `string` **olmaz**.
- `case` değerleri sabit olmalı (`case x:` olmaz, `case 5:` / `case 'A':` olur).
- `break` unutulursa alttaki case'ler de çalışır: **fall-through (düşme)**.
- `default` isteğe bağlıdır.

### Fall-through bazen işe yarar
```cpp
char harf; cin >> harf;
switch (harf) {
    case 'a': case 'e': case 'i': case 'o': case 'u':
        cout << "Unlu\n"; break;
    default:
        cout << "Unsuz\n";
}
```

@q out
Q: `x = 2` için çıktı nedir?
```cpp
switch (x) {
    case 1: cout << "Bir ";
    case 2: cout << "Iki ";
    case 3: cout << "Uc ";
        break;
    case 4: cout << "Dort ";
    default: cout << "Diger";
}
```
ANS: Iki Uc
E: x=2 → "Iki " yazılır, `break` olmadığı için case 3'e düşer: "Uc ", sonra break ile çıkılır.
@end

@q mcq
Q: Hangisi `switch` içinde kullanılamaz?
A: `int` değişken
A: `char` değişken
A*: `string` değişken
A: `enum` değişken
E: switch sadece tamsayı türleri (int, char, enum...) ile çalışır. string için if-else kullanmalısın.
@end

@task Menülü Hesap Makinesi
`switch-case` ile 5 seçenekli bir menü yap: 1-Toplama, 2-Çıkarma, 3-Çarpma, 4-Bölme, 5-Mod alma. Kullanıcı seçim yapsın, iki sayı girsin, sonuç yazılsın.
- Bölme ve mod'da sıfıra bölme kontrolü yap.
- Mod işlemi için sayıları `int`'e çevir.
- Geçersiz seçim için `default` kullan.
HINT: Mod için: `static_cast<int>(a) % static_cast<int>(b)`
SOL:
```cpp
#include <iostream>
using namespace std;

int main() {
    int secim; double a, b;
    cout << "1-Topla 2-Cikar 3-Carp 4-Bol 5-Mod\nSecim: ";
    cin >> secim;
    cout << "Iki sayi: ";
    cin >> a >> b;
    switch (secim) {
        case 1: cout << "Sonuc: " << a + b << endl; break;
        case 2: cout << "Sonuc: " << a - b << endl; break;
        case 3: cout << "Sonuc: " << a * b << endl; break;
        case 4:
            if (b == 0) cout << "Sifira bolunmez!\n";
            else cout << "Sonuc: " << a / b << endl;
            break;
        case 5:
            if (static_cast<int>(b) == 0) cout << "Sifira bolunmez!\n";
            else cout << "Sonuc: " << static_cast<int>(a) % static_cast<int>(b) << endl;
            break;
        default: cout << "Gecersiz secim!\n";
    }
    return 0;
}
```
@end

=== Koşul Operatörü ?: ve Ondalık Karşılaştırma
### Ternary operatör
`kosul ? dogruysa : yanlissa` — kısa if-else'in **değer üreten** halidir.
```cpp
int a = 7, b = 12;
int buyuk = (a > b) ? a : b;                 // 12
cout << (a % 2 == 0 ? "cift" : "tek");       // tek
```
Zincirlenebilir (ama abartma, okunması zorlaşır):
```cpp
int n = 0;
string s = (n > 0) ? "pozitif" : (n < 0) ? "negatif" : "sifir";
```

@q out
Q: Çıktı nedir?
```cpp
int x = 15;
cout << (x > 10 ? (x > 20 ? "C" : "B") : "A") << endl;
```
ANS: B
E: 15 > 10 doğru → iç ifadeye bakılır: 15 > 20 yanlış → "B".
@end

### Ondalıklı sayıları `==` ile karşılaştırma!
```cpp
double a = 0.1 + 0.2;
if (a == 0.3) cout << "esit";      // ÇALIŞMAZ! a = 0.30000000000000004
else cout << "esit degil";
```
Bilgisayar ondalıkları ikili sistemde tam saklayamaz. Doğru yöntem: farkın çok küçük olup olmadığına bak.
```cpp
#include <cmath>
if (fabs(a - 0.3) < 1e-9) cout << "esit";
```

@q mcq
Q: `double d = 0.1 + 0.2; cout << (d == 0.3);` ne yazar?
A: 1
A*: 0
A: 0.3
A: Derleme hatası
E: Kayan nokta hassasiyeti yüzünden d tam 0.3 değildir; karşılaştırma false → 0.
@end

@task Not Ortalaması ve Harf Notu
Kullanıcıdan **ad soyad** (`string`, `getline` ile), vize ve final notlarını al. Ortalama = %40 vize + %60 final.
- Notlar 0-100 dışında ise hata ver.
- Ortalamaya göre harf notunu (AA/BA/BB/CB/CC/DC/DD/FF) else-if ile bul. (90, 85, 80, 75, 70, 60, 50 eşiklerini kullanabilirsin.)
- Final < 50 ise ortalama ne olursa olsun "FF (final barajı)" yazsın.
- Sonucu `?:` ile "BASARILI / BASARISIZ" olarak da yazdır (CC ve üstü başarılı).
HINT: `getline(cin, adSoyad);` boşluklu metin okur.
HINT: Baraj kontrolünü merdivenin **en başına** koy.
SOL:
```cpp
#include <iostream>
#include <string>
using namespace std;

int main() {
    string ad;
    double vize, fin;
    cout << "Ad Soyad: ";
    getline(cin, ad);
    cout << "Vize ve final: ";
    cin >> vize >> fin;
    if (vize < 0 || vize > 100 || fin < 0 || fin > 100) {
        cout << "Hatali not!\n";
        return 1;
    }
    double ort = vize * 0.4 + fin * 0.6;
    string harf;
    if (fin < 50)       harf = "FF (final baraji)";
    else if (ort >= 90) harf = "AA";
    else if (ort >= 85) harf = "BA";
    else if (ort >= 80) harf = "BB";
    else if (ort >= 75) harf = "CB";
    else if (ort >= 70) harf = "CC";
    else if (ort >= 60) harf = "DC";
    else if (ort >= 50) harf = "DD";
    else                harf = "FF";
    bool basarili = (fin >= 50 && ort >= 70);
    cout << ad << " -> ortalama: " << ort << ", harf: " << harf
         << ", " << (basarili ? "BASARILI" : "BASARISIZ") << endl;
    return 0;
}
```
@end

=== for Döngüsü
### Aynı işi tekrar tekrar yapmak
```cpp
for (baslangic; kosul; artis) {
    // tekrar edilecek kodlar
}
```
1. `baslangic` bir kez çalışır.
2. `kosul` kontrol edilir; **false** ise döngü biter.
3. Gövde çalışır.
4. `artis` çalışır, 2. adıma dönülür.

```cpp
// 1'den 10'a kadar yazdır
for (int i = 1; i <= 10; i++) {
    cout << i << " ";
}
// 1'den n'e kadar topla
int n = 100, toplam = 0;
for (int i = 1; i <= n; i++) {
    toplam += i;
}
cout << "Toplam: " << toplam << endl;   // 5050
```

### Farklı for kullanımları
```cpp
for (int i = 10; i > 0; i--) ...            // geriye say
for (int i = 0; i <= 100; i += 5) ...       // 5'er 5'er
for (int i = 0, j = 10; i < j; i++, j--) ...// iki sayaç
int k = 0;
for (; k < 5; ) { k++; }                    // parçalar boş bırakılabilir
```

@q out
Q: Çıktı nedir?
```cpp
for (int i = 0; i < 10; i += 3)
    cout << i << " ";
```
ANS: 0 3 6 9
E: i = 0, 3, 6, 9 yazılır; i = 12 olunca 12 < 10 yanlış → biter.
@end

@q fill
Q: `for (int i = 5; i < 20; i += 4)` döngüsü kaç kez döner? (sadece sayı)
ANS: 4
E: i = 5, 9, 13, 17 → 4 kez. 21 olunca durur.
@end

@q out
Q: Çıktı nedir?
```cpp
int s = 0;
for (int i = 1; i <= 5; i++)
    s += i * i;
cout << s;
```
ANS: 55
E: 1 + 4 + 9 + 16 + 25 = 55.
@end

=== while ve do-while
### while: önce kontrol, sonra çalış
Kaç kez döneceğini bilmediğin durumlar için idealdir.
```cpp
int sayi = 1234, basamakToplam = 0;
while (sayi > 0) {
    basamakToplam += sayi % 10;   // son basamak
    sayi /= 10;                   // son basamağı at
}
cout << basamakToplam;   // 10
```

### do-while: önce çalış, sonra kontrol
Gövde **en az bir kez** çalışır. Kullanıcıdan geçerli girdi almak için birebirdir:
```cpp
int not1;
do {
    cout << "0-100 arasi not gir: ";
    cin >> not1;
} while (not1 < 0 || not1 > 100);
```
> [!WARN]
> `do { ... } while (kosul);` — sonundaki **noktalı virgülü** unutma!

### Karşılaştırma
| | for | while | do-while |
|---|---|---|---|
| Kontrol ne zaman? | Başta | Başta | Sonda |
| En az kaç kez çalışır? | 0 | 0 | **1** |
| Ne zaman kullanılır? | Tekrar sayısı belli | Koşula bağlı | Girdi doğrulama, menü |

@q out
Q: Çıktı nedir?
```cpp
int i = 10;
do {
    cout << i << " ";
    i++;
} while (i < 5);
cout << "son";
```
ANS: 10 son
E: do-while koşula bakmadan bir kez çalışır: "10 " yazılır. Sonra 11 < 5 yanlış → çıkar.
@end

@q out
Q: Çıktı nedir?
```cpp
int n = 50, adim = 0;
while (n > 1) {
    n /= 2;
    adim++;
}
cout << n << " " << adim;
```
ANS: 1 5
E: 50 → 25 → 12 → 6 → 3 → 1 : 5 adım.
@end

### Bekçi değerli (sentinel) döngü
Kullanıcı özel bir değer (ör. `-1`) girene kadar okumaya devam et:
```cpp
int x, toplam = 0, adet = 0;
cout << "Sayilari gir (-1 bitirir): ";
cin >> x;
while (x != -1) {
    toplam += x; adet++;
    cin >> x;
}
if (adet > 0) cout << "Ortalama: " << (double)toplam / adet << endl;
```

=== break ve continue
- `break` → döngüden **tamamen çık**.
- `continue` → bu turun kalanını **atla**, sonraki tura geç.

```cpp
for (int i = 1; i <= 10; i++) {
    if (i == 7) break;          // 7'ye gelince döngü biter
    if (i % 2 == 0) continue;   // çiftleri atla
    cout << i << " ";
}
// Çıktı: 1 3 5
```

@q out
Q: Çıktı nedir?
```cpp
for (int i = 1; i <= 6; i++) {
    if (i == 3) continue;
    if (i == 5) break;
    cout << i;
}
```
ANS: 124
E: 1, 2 yazılır; 3 atlanır; 4 yazılır; 5'te döngü biter.
@end

### break ile kullanıcı kontrollü "sonsuz" döngü
```cpp
while (true) {
    int secim;
    cout << "1-Devam 0-Cikis: ";
    cin >> secim;
    if (secim == 0) break;
    cout << "Devam ediyoruz...\n";
}
```

@q mcq
Q: İç içe iki döngüde, içteki döngüde çalışan `break` neyi sonlandırır?
A: Her iki döngüyü
A*: Sadece içteki döngüyü
A: Tüm programı
A: Sadece dıştaki döngüyü
E: break sadece içinde bulunduğu en yakın döngüden (veya switch'ten) çıkar.
@end

=== İç İçe Döngüler ve Desenler
Dıştaki döngünün **her** turunda içteki döngü baştan sona çalışır.
```cpp
// Çarpım tablosu
for (int i = 1; i <= 3; i++) {
    for (int j = 1; j <= 3; j++) {
        cout << i * j << "\t";
    }
    cout << endl;
}
```
```text
1	2	3
2	4	6
3	6	9
```

### Yıldız üçgeni
```cpp
int n = 4;
for (int i = 1; i <= n; i++) {        // satır
    for (int j = 1; j <= i; j++) {    // her satırda i tane yıldız
        cout << "*";
    }
    cout << endl;
}
```
```text
*
**
***
****
```

@q out
Q: Çıktı nedir?
```cpp
for (int i = 1; i <= 3; i++) {
    for (int j = i; j <= 3; j++)
        cout << j;
    cout << endl;
}
```
ANS: 123\n23\n3
E: i=1: j=1..3 → 123. i=2: j=2..3 → 23. i=3: j=3 → 3.
@end

@q fill
Q: Aşağıdaki kodda `cout << "x";` kaç kez çalışır? (sadece sayı) `for(int i=0;i<4;i++) for(int j=0;j<5;j++) cout << "x";`
ANS: 20
E: Dış 4 tur × iç 5 tur = 20.
@end

@q order
Q: 4 satırlık **ters** yıldız üçgenini (`****`, `***`, `**`, `*`) çizen kodu doğru sıraya diz.
L: for (int i = 4; i >= 1; i--) {
L:     for (int j = 1; j <= i; j++) {
L:         cout << "*";
L:     }
L:     cout << endl;
L: }
E: Dış döngü satır sayısını, iç döngü o satırdaki yıldız sayısını belirler. `endl` iç döngüden sonra, dış döngünün içinde olmalı.
@end

=== Klasik Hatalar ve Range-based for
### Sonsuz döngü
Koşul hiç yanlış olmazsa döngü bitmez:
```cpp
int i = 0;
while (i < 10) {
    cout << i;
    // i++ unutuldu → sonsuza kadar 0 yazar!
}
```
Terminalde takılan programı durdurmak için **Ctrl + C**.

### Bir eksik / bir fazla (off-by-one)
```cpp
int dizi[5];
for (int i = 0; i <= 5; i++)   // HATA: i = 5 olunca dizinin dışına çıkılır!
    dizi[i] = 0;
for (int i = 0; i < 5; i++)    // DOĞRU: 0,1,2,3,4
    dizi[i] = 0;
```

### Döngüde noktalı virgül tuzağı
```cpp
for (int i = 0; i < 5; i++);    // ← bu ; döngünün gövdesi oldu!
{
    cout << "Merhaba";          // sadece 1 kez yazar
}
```

### Ondalıklı sayaç kullanma
```cpp
for (double x = 0; x != 1.0; x += 0.1)   // 1.0'a tam eşit olmayabilir → sonsuz!
```
Sayaçları her zaman `int` yap.

### Range-based for (C++11)
Dizinin her elemanını sırayla gezer:
```cpp
int notlar[] = {70, 85, 90};
for (int n : notlar) {
    cout << n << " ";
}
```

@q out
Q: Çıktı nedir?
```cpp
int t = 0;
for (int i = 0; i < 4; i++);
    t++;
cout << t;
```
ANS: 1
E: for'un sonundaki `;` boş gövdedir. Döngü 4 kez boşa döner, `t++` döngüden sonra **bir kez** çalışır.
@end

@q mcq
Q: Hangisi kesin olarak sonsuz döngüdür?
A: `for (int i = 0; i < 10; i++) {}`
A*: `for (int i = 0; i < 10; i--) {}`  *(taşmayı yok sayarsak)*
A: `while (false) {}`
A: `do {} while (0);`
E: i her turda azalır, hep 10'dan küçük kalır. (Teknik olarak int sınırında taşma olur ama bu tanımsız davranıştır.)
@end

@task Asal Sayı Kontrolü
Kullanıcıdan bir tamsayı al ve asal olup olmadığını söyle.
- 2'den küçük sayılar asal değildir.
- Bölen bulduğun anda `break` ile döngüden çık.
- Bonus: 1-100 arasındaki tüm asal sayıları yazdır.
HINT: Bölen aramayı `i * i <= n` olana kadar yapman yeter.
SOL:
```cpp
#include <iostream>
using namespace std;

int main() {
    int n;
    cout << "Sayi: ";
    cin >> n;
    bool asal = (n >= 2);
    for (int i = 2; i * i <= n; i++) {
        if (n % i == 0) { asal = false; break; }
    }
    cout << n << (asal ? " asaldir" : " asal degildir") << endl;

    // Bonus
    for (int k = 2; k <= 100; k++) {
        bool a = true;
        for (int i = 2; i * i <= k; i++)
            if (k % i == 0) { a = false; break; }
        if (a) cout << k << " ";
    }
    cout << endl;
    return 0;
}
```
@end

@task Fibonacci Serisi
Kullanıcıdan `n` al, Fibonacci serisinin ilk `n` terimini yazdır: `0 1 1 2 3 5 8 13 ...`
- Her yeni terim önceki ikisinin toplamıdır.
- `long long` kullan (büyük n'lerde int taşar).
- Bonus: Ardışık iki terimin oranı (`b / a`) altın orana (1.618...) yaklaşır, son oranı yazdır.
HINT: `a = 0, b = 1` ile başla; her turda `c = a + b; a = b; b = c;`

```cpp
#include <iostream>
using namespace std;

int main() {
    int n;
    cout << "Kac terim? ";
    cin >> n;
    long long a = 0, b = 1;
    for (int i = 0; i < n; i++) {
        cout << a << " ";
        long long c = a + b;
        a = b;
        b = c;
    }
    cout << endl;
    if (n > 2) cout << "Oran: " << (double)b / a << endl;
    return 0;
}
```

=== cin ile Girdi Almak
### Temeller
`cin >>` klavyeden okur. **Boşluk, tab ve Enter'da durur** ve baştaki boşlukları atlar.
```cpp
int yas; double boy; string ad;
cin >> yas;                  // 20
cin >> boy >> ad;            // 1.70 Asli  (aynı satırda boşlukla ayrılabilir)
```
Kullanıcı `Asli Yilmaz` yazarsa `cin >> ad;` sadece **Asli**'yi alır; `Yilmaz` tamponda (buffer) bekler!

### Boşluklu metin: getline
```cpp
string adSoyad;
getline(cin, adSoyad);       // Enter'a kadar tüm satırı okur: "Asli Yilmaz"
```

@q mcq
Q: Kullanıcı `Ankara Turkiye` yazıp Enter'a bastı. `string s; cin >> s;` sonrası `s` nedir?
A: Ankara Turkiye
A*: Ankara
A: Turkiye
A: Boş
E: `cin >>` ilk boşlukta durur. Satırın tamamı için `getline(cin, s)` kullanılır.
@end

### En meşhur tuzak: `cin >>` sonrası `getline`
```cpp
int yas;
string ad;
cout << "Yas: ";      cin >> yas;          // kullanıcı 20 yazıp Enter'a bastı
cout << "Ad Soyad: "; getline(cin, ad);    // BEKLEMEDEN geçer, ad boş kalır!
```
Neden? `cin >> yas` sadece `20`'yi aldı, Enter'ın ürettiği `'\n'` tamponda kaldı. `getline` onu görünce "satır bitti" sanıyor.

Çözüm: araya `cin.ignore()` koymak.
```cpp
cin >> yas;
cin.ignore();                // tampondaki '\n'yi at
getline(cin, ad);
```
Daha sağlamı (satırda kalan her şeyi at):
```cpp
#include <limits>
cin.ignore(numeric_limits<streamsize>::max(), '\n');
```

@q mcq
Q: `cin >> n;` ile sayı okuduktan hemen sonra `getline(cin, s);` çalışmadan geçiyor. Sebebi nedir?
A: getline sayılardan sonra çalışmaz
A*: Tamponda kalan `'\n'` karakteri getline tarafından boş satır olarak okunur
A: `string` kütüphanesi eklenmemiştir
A: n değişkeni çok büyüktür
E: Çözüm: arada `cin.ignore();` kullanmak.
@end

### Diğer cin metotları
| Metot | Ne yapar? |
|---|---|
| `cin.get(c)` | Boşluk dahil **tek karakter** okur |
| `cin.peek()` | Sıradaki karaktere bakar ama **almaz** |
| `cin.putback(c)` | Okunan karakteri tampona geri koyar |
| `cin.ignore(n, ch)` | `ch` görene kadar en çok n karakter atlar |
| `cin.fail()` | Son okuma başarısız mı? |
| `cin.clear()` | Hata durumunu sıfırlar |

=== Hatalı Girdiyi Yönetmek
Kullanıcı `int` beklenen yere `abc` yazarsa `cin` **hata durumuna (fail state)** geçer. Bu durumdayken sonraki bütün `cin` okumaları da çalışmaz! Kurtarmak için iki adım:
1. `cin.clear()` → hata bayrağını temizle
2. `cin.ignore(...)` → tampondaki bozuk karakterleri at

Hocanın derste yazdığı not okuma fonksiyonunun sade hali:
```cpp
#include <iostream>
#include <limits>
#include <string>
using namespace std;

float notAl(const string& mesaj) {
    float n;
    while (true) {
        cout << mesaj;
        cin >> n;
        if (cin.fail()) {                         // harf girildi
            cout << "Gecersiz giris, sayi gir!\n";
            cin.clear();                          // 1) hatayı temizle
            cin.ignore(numeric_limits<streamsize>::max(), '\n'); // 2) tamponu boşalt
        } else if (n < 0 || n > 100) {
            cout << "Not 0-100 arasi olmali!\n";
            cin.ignore(numeric_limits<streamsize>::max(), '\n');
        } else {
            cin.ignore(numeric_limits<streamsize>::max(), '\n');
            return n;
        }
    }
}

int main() {
    float v = notAl("Vize: ");
    float f = notAl("Final: ");
    cout << "Ortalama: " << v * 0.4 + f * 0.6 << endl;
    return 0;
}
```

@q order
Q: `cin` hata durumuna düştüğünde yapılacakları doğru sıraya koy.
L: if (cin.fail()) {
L:     cin.clear();
L:     cin.ignore(1000, '\n');
L:     cout << "Tekrar dene\n";
L: }
E: Önce `clear()` ile hata bayrağı temizlenmeli; aksi halde `ignore()` bile çalışmaz. Sonra tampon boşaltılır.
@end

@q mcq
Q: `cin.peek()` ne yapar?
A: Tamponu temizler
A*: Sıradaki karakteri tampondan çıkarmadan döndürür
A: Bir satır okur
A: Ekrana bir karakter yazar
E: Hoca bunu "kullanıcı rakam mı yazdı yoksa harf mi" diye önceden bakmak için kullandı.
@end

=== Biçimlendirilmiş Çıktı (iomanip)
Tablo gibi düzgün çıktılar için `#include <iomanip>` gerekir.

| Manipülatör | Görevi | Kalıcı mı? |
|---|---|---|
| `setw(n)` | Sonraki değeri n karakterlik alana yazar | **Hayır, sadece bir sonraki** |
| `setprecision(n)` | Basamak sayısı | Evet |
| `fixed` | Ondalık gösterim; setprecision artık **virgülden sonraki** basamak olur | Evet |
| `showpoint` | `3.0` gibi sayılarda noktayı ve sıfırları gösterir | Evet |
| `left` / `right` | Alan içinde sola / sağa yasla | Evet |
| `setfill(c)` | Boş alanı `c` ile doldurur | Evet |

### setprecision: fixed var mı yok mu?
```cpp
double pi = 3.14159265;
cout << setprecision(3) << pi << endl;           // 3.14   (toplam 3 anlamlı basamak)
cout << fixed << setprecision(3) << pi << endl;  // 3.142  (virgülden sonra 3 basamak)
```

@q out
Q: Çıktı nedir?
```cpp
double x = 12.34567;
cout << fixed << setprecision(2) << x << endl;
```
ANS: 12.35
E: fixed ile virgülden sonra 2 basamak; yuvarlanır: 12.35
@end

@q out
Q: Çıktı nedir? (fixed **yok**)
```cpp
double x = 12.34567;
cout << setprecision(4) << x << endl;
```
ANS: 12.35
E: fixed yokken setprecision toplam anlamlı basamak sayısıdır: 1,2,3,4 → 12.35
@end

### setw, left/right, setfill
```cpp
cout << left  << setw(10) << "Ad"   << right << setw(6) << "Not" << endl;
cout << left  << setw(10) << "Asli" << right << setw(6) << 95 << endl;
cout << setfill('*') << setw(6) << 42 << endl;    // ****42
```
```text
Ad           Not
Asli          95
****42
```

@q mcq
Q: `cout << setfill('0') << setw(5) << 37;` ne yazar? (boşlukları · ile gösterdik)
A: `37000`
A*: `00037`
A: `···37`
A: `37`
E: Varsayılan hizalama sağdır; 5 karakterlik alanda soldaki boşluklar '0' ile dolar.
@end

@q mcq
Q: `cout << setw(5) << 1 << 2;` çıktısı nedir? (boşluklar ·)
A: `····1····2`
A*: `····12`
A: `12···`
A: `···12`
E: setw kalıcı değildir — sadece hemen sonraki değere (1) uygulanır. 2 bitişik yazılır.
@end

```cpp

```

@task Öğrenci Not Tablosu (Hocanın derste verdiği görev)
3 öğrencinin **adını** (getline ile), vize ve final notlarını al. Ortalama = %40 vize + %60 final. Sonra düzgün bir tablo yazdır:
```text
Ad Soyad            Vize  Final   Ort.
--------------------------------------
Asli Yilmaz           80     90  86.00
Mehmet Kaya           45     60  54.00
```
- Hatalı not girişinde (harf, 0-100 dışı) tekrar sorsun.
- Ortalamayı `fixed` ve `setprecision(2)` ile yaz.
HINT: İsimler için `string adlar[3]`, notlar için `float vize[3], fin[3]` dizileri kullanabilirsin (diziler Hafta 5'te detaylı).
HINT: Sayı okuduktan sonra `getline` kullanacaksan araya `cin.ignore(...)` koymayı unutma.
SOL:
```cpp
#include <iostream>
#include <iomanip>
#include <limits>
#include <string>
using namespace std;

float notAl(const string& mesaj) {
    float n;
    while (true) {
        cout << mesaj;
        if (cin >> n && n >= 0 && n <= 100) {
            cin.ignore(numeric_limits<streamsize>::max(), '\n');
            return n;
        }
        cout << "Hatali! 0-100 arasi sayi gir.\n";
        cin.clear();
        cin.ignore(numeric_limits<streamsize>::max(), '\n');
    }
}

int main() {
    const int N = 3;
    string ad[N];
    float vize[N], fin[N];
    for (int i = 0; i < N; i++) {
        cout << i + 1 << ". ogrenci adi: ";
        getline(cin, ad[i]);
        vize[i] = notAl("  Vize : ");
        fin[i]  = notAl("  Final: ");
    }
    cout << left << setw(18) << "Ad Soyad" << right << setw(6) << "Vize"
         << setw(7) << "Final" << setw(7) << "Ort." << endl;
    cout << setfill('-') << setw(38) << "" << setfill(' ') << endl;
    cout << fixed << setprecision(2);
    for (int i = 0; i < N; i++) {
        cout << left << setw(18) << ad[i] << right
             << setw(6) << (int)vize[i] << setw(7) << (int)fin[i]
             << setw(7) << vize[i] * 0.4 + fin[i] * 0.6 << endl;
    }
    return 0;
}
```
@end

=== Dosya İşlemleri
Programın verisi kapanınca kaybolur. Kalıcı saklamak için dosyaya yazarız. Gereken kütüphane: `#include <fstream>`

| Sınıf | Ne için? |
|---|---|
| `ofstream` | Dosyaya **yazma** (output) |
| `ifstream` | Dosyadan **okuma** (input) |
| `fstream` | İkisi birden |

### Dosyaya yazmak
```cpp
#include <fstream>
...
ofstream dosya("notlar.txt");          // yoksa oluşturur, varsa İÇİNİ SİLER
if (!dosya.is_open()) {
    cout << "Dosya acilamadi!\n";
    return 1;
}
dosya << "Asli 85\n";                  // cout gibi kullanılır!
dosya << "Mehmet 70\n";
dosya.close();
```

### Dosyadan okumak
```cpp
ifstream oku("notlar.txt");
string ad; int puan;
while (oku >> ad >> puan) {            // okuma başarılı oldukça devam et
    cout << ad << ": " << puan << endl;
}
oku.close();

// Satır satır okumak:
ifstream f("metin.txt");
string satir;
while (getline(f, satir)) {
    cout << satir << endl;
}
```

### Açılış modları
| Mod | Anlamı |
|---|---|
| `ios::out` | Yazma (varsayılan, eski içerik silinir) |
| `ios::app` | Sonuna **ekleme** (append) — eski içerik korunur |
| `ios::in` | Okuma |
| `ios::trunc` | Açarken içeriği sil |
| `ios::binary` | İkili mod |
| `ios::ate` | Açınca dosya sonuna git |

```cpp
ofstream log("kayit.txt", ios::app);   // her çalıştırmada sona ekler
log << "Program calisti\n";
```

A: `ios::out`
A: `ios::trunc`

@task Not Defteri Dosyası
1. Kullanıcıdan isim ve not çiftlerini al (isim yerine `q` yazınca dursun) ve `notlar.txt` dosyasına **ekleme modunda** yaz.
2. Sonra dosyayı baştan oku; kayıt sayısını, ortalamayı ve en yüksek notu alan kişiyi yazdır.
HINT: Yazma: `ofstream out("notlar.txt", ios::app);` — okuma: `ifstream in("notlar.txt");`
HINT: Okurken `while (in >> ad >> puan)` kalıbını kullan.
SOL:
```cpp
#include <iostream>
#include <fstream>
#include <string>
using namespace std;

int main() {
    ofstream out("notlar.txt", ios::app);
    string ad; int puan;
    while (true) {
        cout << "Isim (bitirmek icin q): ";
        cin >> ad;
        if (ad == "q") break;
        cout << "Not: ";
        cin >> puan;
        out << ad << " " << puan << "\n";
    }
    out.close();

    ifstream in("notlar.txt");
    if (!in) { cout << "Dosya acilamadi\n"; return 1; }
    int adet = 0, toplam = 0, enYuksek = -1;
    string enIyi;
    while (in >> ad >> puan) {
        adet++; toplam += puan;
        if (puan > enYuksek) { enYuksek = puan; enIyi = ad; }
    }
    in.close();
    if (adet > 0) {
        cout << adet << " kayit, ortalama: " << (double)toplam / adet
             << ", en yuksek: " << enIyi << " (" << enYuksek << ")\n";
    }
    return 0;
}
```
@end

=== Hazır Fonksiyonlar
C++ kütüphaneleri birçok hazır fonksiyon sunar:

| Fonksiyon | Kütüphane | Örnek | Sonuç |
|---|---|---|---|
| `sqrt(x)` | `<cmath>` | `sqrt(25)` | 5 |
| `pow(x, y)` | `<cmath>` | `pow(2, 10)` | 1024 |
| `abs(x)` / `fabs(x)` | `<cmath>` | `fabs(-3.5)` | 3.5 |
| `ceil(x)` | `<cmath>` | `ceil(2.1)` | 3 (yukarı) |
| `floor(x)` | `<cmath>` | `floor(2.9)` | 2 (aşağı) |
| `round(x)` | `<cmath>` | `round(2.5)` | 3 |
| `rand()`, `srand()` | `<cstdlib>` | `rand() % 6 + 1` | 1-6 arası zar |
| `time(0)` | `<ctime>` | `srand(time(0))` | her çalıştırmada farklı rastgelelik |
| `toupper(c)` | `<cctype>` | `toupper('a')` | 'A' (int döner) |
| `isdigit(c)` | `<cctype>` | `isdigit('7')` | true |

@q out

```
ANS: 5 -3 27 9

=== Kendi Fonksiyonunu Yazmak
### Yapı
```cpp

    return deger;
}
```
```cpp
#include <iostream>
using namespace std;

int topla(int a, int b);        // PROTOTİP (bildirim) - main'den önce

=== Varsayılan Parametreler
Parametreye varsayılan değer verilebilir; çağrıda verilmezse o kullanılır.

**Kural:** Varsayılan değerler **sağdan sola** verilir. Bir parametreye varsayılan verdiysen, sağındakilerin hepsine vermelisin.

=== Pointer (Gösterici)
### Her değişkenin bir adresi vardır
Bellek, numaralanmış kutucuklar gibidir. `&` operatörü bir değişkenin **adresini** verir. Adres tutan değişkene **pointer** denir.
```cpp
int b = 10;
int* ptr;          // int adresi tutabilen pointer
ptr = &b;          // ptr artık b'nin adresini tutuyor

cout << b;         // 10        (değer)
cout << &b;        // 0x7ff...  (b'nin adresi)
cout << ptr;       // 0x7ff...  (aynı adres)
cout << *ptr;      // 10        (ptr'nin gösterdiği yerdeki değer)
cout << &ptr;      // pointer'ın kendi adresi (başka bir adres)

*ptr = 25;         // b'yi pointer üzerinden değiştir
cout << b;         // 25
```
| Yazılış | Anlamı |
|---|---|
| `int* p` | p bir int pointer'ı (tanımlarken) |
| `&x` | x'in adresi |
| `*p` | p'nin gösterdiği değer (dereference) |
| `p = nullptr` | p hiçbir yeri göstermiyor |

> [!WARN]
> Başlatılmamış ya da `nullptr` olan bir pointer'ı `*p` ile kullanmak programı çökertir (segmentation fault). Pointer'ı her zaman `nullptr` ile başlat.

@q out
Q: Çıktı nedir?
```cpp
int a = 5, b = 8;
int* p = &a;
*p = *p + 10;
p = &b;
*p = *p * 2;
cout << a << " " << b;
```
ANS: 15 16
E: Önce p → a, a = 15 olur. Sonra p → b, b = 16 olur.
@end

### Pointer aritmetiği ve diziler
Dizi adı, ilk elemanın adresidir. `p + 1` bir sonraki **elemana** (sizeof(int) byte ileri) gider.
```cpp
int dizi[] = {10, 20, 30, 40};
int* p = dizi;           // &dizi[0]
cout << *p;              // 10
cout << *(p + 2);        // 30   (dizi[2] ile aynı)
p++;
cout << *p;              // 20
```

@q out
Q: Çıktı nedir?
```cpp
int d[] = {3, 6, 9, 12};
int* p = d + 1;
cout << *p << " " << *(p + 2) << " " << p[1];
```
ANS: 6 12 9
E: p, d[1]'i gösterir (6). p+2 → d[3] = 12. `p[1]` = `*(p+1)` = d[2] = 9.
@end

=== Diziler, static, Aşırı Yükleme ve Özyineleme
### Dizileri fonksiyona göndermek
Dizi fonksiyona **adres olarak** gider (kopyalanmaz). Bu yüzden fonksiyon diziyi değiştirirse asıl dizi de değişir. Boyut bilgisi kaybolur, ayrıca gönderilmeli.
```cpp
void ikiyeKatla(int d[], int n) {
    for (int i = 0; i < n; i++) d[i] *= 2;
}
int toplam(const int d[], int n) {    // const: değiştirmeyeceğim sözü
    int s = 0;
    for (int i = 0; i < n; i++) s += d[i];
    return s;
}
```

### static yerel değişken
Normal yerel değişken her çağrıda sıfırdan oluşur. `static` olan ise **değerini korur** ve sadece bir kez başlatılır.
```cpp
void sayac() {
    static int adet = 0;   // sadece ilk çağrıda 0 yapılır
    int normal = 0;
    adet++; normal++;
    cout << adet << "-" << normal << " ";
}
// sayac(); sayac(); sayac();  → 1-1 2-1 3-1
```

@q out
Q: Çıktı nedir?
```cpp
int f() {
    static int s = 10;
    s += 5;
    return s;
}
int main() {
    f(); f();
    cout << f();
}
```
ANS: 25
E: static s her çağrıda korunur: 15, 20, 25.
@end

### Fonksiyon aşırı yükleme (overloading)
Aynı isim, **farklı parametre listesi** (sayı veya tür):
```cpp
int    alan(int kenar)            { return kenar * kenar; }
int    alan(int en, int boy)      { return en * boy; }
double alan(double r)             { return 3.14159 * r * r; }
// alan(4) → 16, alan(2, 3) → 6, alan(1.0) → 3.14159
```
Sadece dönüş tipi farklı olan iki fonksiyon aşırı yüklenemez!

### Özyineleme (recursion)
Fonksiyon kendini çağırır. Mutlaka bir **durma koşulu** (base case) olmalı.
```cpp
int faktoriyel(int n) {
    if (n <= 1) return 1;           // durma koşulu
    return n * faktoriyel(n - 1);   // kendini çağır
}
// faktoriyel(4) = 4 * 3 * 2 * 1 = 24
```

@q out
Q: Çıktı nedir?
```cpp
int f(int n) {
    if (n == 0) return 0;
    return n % 10 + f(n / 10);
}
int main() { cout << f(4321); }
```
ANS: 10
E: Basamakların toplamı: 1 + 2 + 3 + 4 = 10.
@end

A: `void f(int)` ve `void f(int, int)`
A*: `int f(int)` ve `double f(int)`
A: `void f(char)` ve `void f(string)`
